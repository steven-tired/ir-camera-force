[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ir-camera-force"
version = "0.1.0"
description = "Private FLIR and Lepton force-sensing research tools"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy",
  "scipy",
  "opencv-python",
]

[tool.setuptools.packages.find]
include = ["ir_force*"]

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"
# The two IR lines have 15 same-named test files (tests/ and tests/classifier/).
# importlib mode gives each its own module identity without __init__.py files,
# which would otherwise change the rootdir semantics conftest.py relies on.
pythonpath = [".", "experiments", "experiments/classifier"]
consider_namespace_packages = true
norecursedirs = ["local", ".git", "*.egg-info", "__pycache__"]
testpaths = ["tests"]

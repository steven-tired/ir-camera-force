[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ir-camera-force"
version = "0.1.0"
description = "Private FLIR and Lepton force-sensing research tools"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy",
  "scipy",
  "opencv-python",
]

[tool.setuptools.packages.find]
include = ["ir_force*"]

[tool.pytest.ini_options]
addopts = "-ra"
norecursedirs = ["local", ".git", "*.egg-info", "__pycache__"]
testpaths = ["tests"]
